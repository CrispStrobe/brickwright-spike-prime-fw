site_name: SPIKE Prime Hub NuttX Guide
site_url: ''
site_description: A guide to running NuttX RTOS on the SPIKE Prime Hub
docs_dir: docs/en
repo_url: https://github.com/CrispStrobe/brickwright-spike-prime-fw
repo_name: CrispStrobe/brickwright-spike-prime-fw

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Project:
      - project/provenance.md
      - project/ti-service-pack.md
      - project/classic-protocol.md
      - project/ble-protocol.md
      - project/hub-contract.md
  - Hardware:
      - hardware/hub-overview.md
      - hardware/pin-mapping.md
      - hardware/peripherals.md
      - hardware/dma-irq.md
  - Drivers:
      - drivers/architecture.md
      - drivers/implementation-plan.md
      - drivers/port-detection.md
      - drivers/lump-protocol.md
      - drivers/sensor.md
      - drivers/motor-control.md
      - drivers/drivebase.md
      - drivers/linetrace.md
      - drivers/imu.md
      - drivers/led.md
      - drivers/battery.md
      - drivers/power.md
      - drivers/sound.md
      - drivers/w25q256.md
      - drivers/bluetooth.md
  - Usage:
      - usage/01-flash-storage.md
  - Development:
      - development/getting-started.md
      - development/debugging.md
      - development/file-transfer.md
      - development/apps.md
      - development/build-protected.md
      - development/nsh-boot-script.md
      - development/pc-receive-spp.md
      - development/bt-nsh-shell.md
      - development/capture.md
      - development/capture-schemas.md
  - NuttX:
      - nuttx/f413-support.md
      - nuttx/tickless-timer.md
      - nuttx/watchdog.md
      - nuttx/upstream-issues.md
  - Testing:
      - testing/test-spec.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - def_list
  - attr_list
  - md_in_html
