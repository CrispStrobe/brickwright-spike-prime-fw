name: Firmware build and simulation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build ${{ matrix.profile }} without publishing artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [simulation, simulation-hci]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Initialize baseline build dependencies
        run: git submodule update --init --depth 1 nuttx nuttx-apps

      - name: Apply and test reviewed NuttX backports
        run: |
          python3 tools/apply_nuttx_backports.py
          python3 tools/test_upstream_hardening.py --nuttx nuttx
          python3 tools/test_upstream_arm_hardening.py --nuttx nuttx
          python3 tools/test_usb_wakeup.py --nuttx nuttx
          python3 tools/test_recursive_mutex_config.py --nuttx nuttx
          python3 tools/test_nuttx_romfs.py --nuttx nuttx
          python3 tools/check_nuttx_apps_hardening.py --apps nuttx-apps --baseline 55f0bc216565ccab8dee600a88f4485c7693bf8b

      - name: Build the pinned tool container
        run: docker build --pull -t nuttx-builder -f docker/Dockerfile.nuttx docker

      - name: Record container and tool versions
        run: |
          docker image inspect nuttx-builder --format 'container={{.Id}}'
          docker run --rm nuttx-builder arm-none-eabi-gcc --version | head -n 2
          docker run --rm nuttx-builder python3 --version
          docker run --rm nuttx-builder make --version | head -n 1

      # CI builds and runs only the two TI-free simulation profiles. The hardware
      # profile embeds TI's chip-restricted service pack and is never built,
      # simulated, or published here.
      - name: Build protected NuttX firmware (selected simulation profile)
        run: |
          set -o pipefail
          make nuttx BOARD_CONFIG=${{ matrix.profile }} V=1 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Record actual selected temporary-file libc member hashes
        run: python3 tools/report_tempfile_link_evidence.py nuttx/nuttx.map nuttx/nuttx_user.map

      - name: Record actual simulation probe object hash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          archive = pathlib.Path('nuttx/staging/libapps.a')
          members = subprocess.check_output(['ar', 't', str(archive)], text=True).splitlines()
          selected = [name for name in members if name.startswith('lumpprobe.c')]
          assert len(selected) == 1, 'Expected exactly one simulation probe object'
          data = subprocess.check_output(['ar', 'p', str(archive), selected[0]])
          assert data, 'Empty simulation probe object'
          print('LUMP probe object: bytes=%d sha256=%s' % (len(data), hashlib.sha256(data).hexdigest()))
          PY

      - name: Test saved programs through real LittleFS interrupted writes
        if: matrix.profile == 'simulation'
        run: |
          python3 tools/test_littlefs_power_loss.py nuttx/fs/littlefs/littlefs
          python3 tools/test_imu_littlefs.py nuttx/fs/littlefs/littlefs

      - name: Prepare an explicit existing-filesystem simulation fixture
        run: |
          python3 tools/test_littlefs_fixture.py --littlefs nuttx/fs/littlefs/littlefs
          python3 tools/test_renode_load_littlefs_fixture.py --littlefs nuttx/fs/littlefs/littlefs
          python3 tools/make_littlefs_fixture.py \
            --littlefs nuttx/fs/littlefs/littlefs \
            --output .local/firmware-images/existing-filesystem

      - name: Verify the TI-free fingerprint against TI's pinned service pack
        run: |
          python3 tools/import_ti_service_pack.py --from-ti \
            --output-dir "$RUNNER_TEMP/ti-reference"
          python3 tools/check_ti_free_image.py --bts \
            "$RUNNER_TEMP/ti-reference/TIInit_6.12.26.bts" \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf
          rm -rf "$RUNNER_TEMP/ti-reference"

      - name: Gate the simulation image and build as TI-free
        run: |
          python3 tools/check_ti_free_image.py \
            nuttx/nuttx.bin nuttx/nuttx_user.bin nuttx/nuttx nuttx/nuttx_user.elf \
            --build-log "$RUNNER_TEMP/build.log" \
            --build-root nuttx --build-root nuttx-apps --build-root apps \
            --config nuttx/.config --elf nuttx/nuttx_user.elf

      - name: Enforce protected resource budgets
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            python3 tools/check_resource_budgets.py

      - name: Verify addressed sensor capability in the actual userspace ELF
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" nuttx-builder \
            python3 tools/check_addressed_sensor_marker.py nuttx/nuttx_user.elf

      - name: Cross-compile Zephyr buffer boundary against pinned NuttX
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            tools/check_zephyr_nuttx_compile.sh

      - name: Cross-compile pinned PSA Bluetooth units
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            nuttx-builder \
            tools/check_zephyr_psa_compile.sh

      - name: Link complete host-side Bluetooth harness
        run: tools/check_zephyr_host_link.sh

      - name: Record local-only outputs
        run: |
          test -s nuttx/nuttx.bin
          test -s nuttx/nuttx_user.bin
          wc -c nuttx/nuttx.bin nuttx/nuttx_user.bin
          sha256sum nuttx/nuttx.bin nuttx/nuttx_user.bin

      - name: Set up the reviewed Renode build SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Build the pinned Renode fork from source
        run: |
          tools/install_renode_fork.sh
          echo "RENODE_DIR=$(tools/install_renode_fork.sh --print-runtime)" >> "$GITHUB_ENV"
          echo "RENODE_TEST_VENV=$(tools/install_renode_fork.sh --print-venv)" >> "$GITHUB_ENV"

      - name: Stage the clean simulation pair
        run: |
          python3 tools/stage_nuttx_image.py brickwright nuttx
          python3 tools/stage_nuttx_image.py brickwright-simulation nuttx

      - name: Check synthetic IMU register transactions and INT1 routing
        run: |
          PATH="$RENODE_TEST_VENV/bin:$PATH" "$RENODE_DIR/renode-test" \
            --results-dir .local/renode-imu-model-results --stop-on-error \
            simulation/renode/imu-model.robot

      - name: Check milestone waits, display latch, ADC DMA and GPIO routing
        run: |
          tools/test_renode_protected_images.sh \
            --variable "PLATFORM:@$PWD/simulation/renode/spike-prime-custom-dma.repl" \
            --include brickwright-exti-routing \
            --include brickwright-adc-dma \
            --include brickwright-display-latch \
            --include brickwright-milestone-wait

      - name: Execute protected firmware in Renode
        if: matrix.profile == 'simulation'
        run: |
          tools/test_renode_protected_images.sh \
            --variable "PLATFORM:@$PWD/simulation/renode/spike-prime-custom-dma.repl" \
            --include brickwright \
            --include brickwright-tickless \
            --include brickwright-userspace \
            --include brickwright-board-models \
            --include brickwright-existing-filesystem-board \
            --include brickwright-board-stubs

      - name: Execute session poll refusals through actual protected userspace
        if: matrix.profile == 'simulation'
        run: |
          PATH="$RENODE_TEST_VENV/bin:$PATH" "$RENODE_DIR/renode-test" \
            --results-dir .local/renode-lump-probe-results --stop-on-error \
            simulation/renode/lump-probe.robot

      - name: Execute active F DATA through actual protected userspace
        if: matrix.profile == 'simulation'
        run: |
          python3 tools/stage_classic_motor_topology.py \
            --runtime "$RENODE_DIR" --output .local/lump-active-topology
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work nuttx-builder \
            python3 tools/collect_lump_queue_layout.py \
            --kernel .local/firmware-images/brickwright/nuttx \
            --output .local/firmware-images/lump-queue-layout.json
          PATH="$RENODE_TEST_VENV/bin:$PATH" "$RENODE_DIR/renode-test" \
            --results-dir .local/renode-lump-active-results --stop-on-error \
            simulation/renode/lump-active.robot

      - name: Execute retained program restarts through the actual ARM service
        if: matrix.profile == 'simulation'
        run: |
          PATH="$RENODE_TEST_VENV/bin:$PATH" "$RENODE_DIR/renode-test" \
            --results-dir .local/renode-program-workflow-results --stop-on-error \
            simulation/renode/program-workflow.robot

      - name: Execute explicit E/F sensors through actual ARM programs
        if: matrix.profile == 'simulation'
        run: |
          PATH="$RENODE_TEST_VENV/bin:$PATH" "$RENODE_DIR/renode-test" \
            --results-dir .local/renode-program-sensor-results --stop-on-error \
            simulation/renode/program-sensors.robot

      - name: Validate the source-generated empty LittleFS seed
        if: matrix.profile == 'simulation'
        run: python3 tools/test_simulation_littlefs_seed.py

      - name: Test the transport-neutral virtual HCI bridge
        if: matrix.profile == 'simulation-hci'
        env:
          BRICKWRIGHT_RENODE_FIRMWARE_TEST: "1"
          BRICKWRIGHT_RENODE_TAG: brickwright-simulation-hci-existing-filesystem
        run: tools/test_renode_virtual_hci_bridge.sh

      - name: Execute LE, Scratch Link, IMU and measured Classic motor peers through Bluetooth air
        if: matrix.profile == 'simulation-hci'
        run: tools/test_bluetooth_air.sh

      # Deliberately no artifact upload. The firmware is simulation-only until
      # its real-hardware safety gate is complete. Renode results also remain
      # inside the ephemeral runner.
